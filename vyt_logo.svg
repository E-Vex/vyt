<svg width="100%" viewBox="220 20 240 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .bg-box { fill: #0f6e56; stroke: #15b886; stroke-width: 2px; }
    .terminal-symbol { stroke: #ffffff; fill: none; }
    .terminal-cursor { fill: #ffffff; }
    .brand-text { fill: #ffffff; font-family: ui-monospace, monospace; font-size: 64px; font-weight: 600; letter-spacing: 2px; text-anchor: middle; }

    @media (prefers-color-scheme: light) {
      .bg-box { fill: #e1f5ee; stroke: #0f6e56; }
      .terminal-symbol { stroke: #0f6e56; }
      .terminal-cursor { fill: #0f6e56; }
      .brand-text { fill: #0d1117; }
    }
  </style>

  <title>vyt logo</title>
  <desc>vyt logo, a rounded terminal icon containing a prompt symbol and cursor with the text vyt below it.</desc>

  <!-- Background Box -->
  <rect class="bg-box" x="240" y="40" width="200" height="200" rx="40"/>

  <!-- Prompt Symbol -->
  <path class="terminal-symbol" d="M 295 95 L 335 140 L 295 185" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor -->
  <rect class="terminal-cursor" x="350" y="172" width="42" height="13" rx="2"/>

  <!-- Brand Text -->
  <text class="brand-text" x="340" y="300">vyt</text>
</svg>
