<svg width="100%" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img">
  <style>
    .bg-box { fill: #111111; stroke: #2d2d2d; stroke-width: 2px; }
    .dot-red { fill: #FF5F56; }
    .dot-yel { fill: #FFBD2E; }
    .dot-grn { fill: #27C93F; }

    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", monospace;
      font-size: 46px;
      font-weight: 700;
    }
    .prompt { fill: #52525B; }
    .text-v { fill: #FFFFFF; }
    .text-yt { fill: #FF0000; }
    .cursor { fill: #FFFFFF; animation: blink 1.2s step-end infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (prefers-color-scheme: light) {
      .bg-box { fill: #F8FAFC; stroke: #E2E8F0; }
      .prompt { fill: #94A3B8; }
      .text-v { fill: #0F172A; }
      .cursor { fill: #0F172A; }
    }
  </style>

  <title>vyt logo</title>
  <desc>A terminal window showing the command vyt with 'v' standing for E-Vex and 'yt' in YouTube red.</desc>

  <!-- Terminal Window Background -->
  <rect class="bg-box" x="16" y="16" width="224" height="224" rx="24"/>

  <!-- macOS Style Window Buttons -->
  <circle class="dot-red" cx="42" cy="42" r="6"/>
  <circle class="dot-yel" cx="62" cy="42" r="6"/>
  <circle class="dot-grn" cx="82" cy="42" r="6"/>

  <!-- Centered Command Text -->
  <text class="terminal-text" x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"><tspan class="prompt">&gt; </tspan><tspan class="text-v">v</tspan><tspan class="text-yt">yt</tspan><tspan class="cursor">_</tspan></text>
</svg>
