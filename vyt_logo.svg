<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>vyt logo</title>
  <desc>A terminal prompt chevron that doubles as a play button, with a cursor and the vyt wordmark</desc>
  <style>
    .bg     { fill: #0b1f1a; stroke: #15b886; stroke-width: 2px; }
    .play   { stroke: #3ddc97; }
    .cursor { stroke: #ff7b72; }
    .word   { stroke: #ffffff; }

    @media (prefers-color-scheme: light) {
      .bg     { fill: #e1f5ee; stroke: #0f6e56; }
      .play   { stroke: #0f6e56; }
      .cursor { stroke: #cf222e; }
      .word   { stroke: #0d1117; }
    }

    .mark { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .big  { stroke-width: 18px; }
    .small{ stroke-width: 8px; }
  </style>

  <!-- Terminal card -->
  <rect class="bg" x="16" y="16" width="224" height="224" rx="40"/>

  <!-- Prompt chevron (also a play button) and cursor -->
  <path class="mark big play" d="M81 60 L125 96 L81 132"/>
  <path class="mark big cursor" d="M139 132 H175"/>

  <!-- "vyt" wordmark, drawn as strokes so no font is needed -->
  <g class="mark small word">
    <path d="M82 170 L94 198 L106 170"/>
    <path d="M118 170 L130 194 M142 170 L124 214"/>
    <path d="M164 158 V190 Q164 198 172 198 M154 172 H174"/>
  </g>
</svg>
